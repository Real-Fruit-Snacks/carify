name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        run: shellcheck carify install.sh tests/run.sh
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # The PowerShell Gallery is flaky from hosted runners: a download fails, or PSGallery
          # isn't registered at all because the gallery was unreachable when PowerShellGet first
          # loaded. Use the module if the runner image already has that version; otherwise
          # re-register the gallery if needed and install, 5 tries, 15/30/45/60 s apart.
          $modules = @(
            @{ Name = 'PSScriptAnalyzer'; Version = '1.25.0' }
          )
          foreach ($m in $modules) {
            if (Get-Module -ListAvailable $m.Name | Where-Object { $_.Version -eq [version]$m.Version }) {
              Write-Host "$($m.Name) $($m.Version) is already on the runner"; continue
            }
            for ($try = 1; $true; $try++) {
              try {
                if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Write-Host 'PSGallery is not registered; registering it'
                  Register-PSRepository -Default -ErrorAction Stop
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                Install-Module $m.Name -RequiredVersion $m.Version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
                Write-Host "Installed $($m.Name) $($m.Version) (try $try)"
                break
              } catch {
                if ($try -ge 5) { throw }
                Write-Warning "Installing $($m.Name) failed (try $try): $_"
                Start-Sleep -Seconds (15 * $try)
              }
            }
          }
          $found = 'carify.ps1', 'install.ps1' | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost }
          $found | Format-Table -AutoSize
          if ($found) { exit 1 }

  bash:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        # Skip the man-db index rebuild, which can stall apt for 40+ minutes.
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends ffmpeg
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: tests/run.sh bash
      - name: macOS /bin/bash 3.2
        if: runner.os == 'macOS'
        run: CARIFY_BASH=/bin/bash /bin/bash tests/run.sh bash
      - name: pwsh on Linux
        if: runner.os == 'Linux'
        run: tests/run.sh pwsh

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: PowerShell 7
        run: tests/run.sh pwsh
      - name: Windows PowerShell 5.1
        run: tests/run.sh powershell
